format: bespoke
format_note: >-
  Not RFC 9457. Two different shapes coexist on the same API. Client errors (4xx) come back
  as a bare text/plain sentence with no code, no type URI and no envelope. Server errors and
  successes come back as a JSON (or XML, by default) envelope
  {statusCode, statusMessage, uri, uriAlias, body}, where body on an error is
  {type, msg}. An agent cannot branch on a machine-readable field for a 4xx because there
  isn't one — it has to string-match English prose.
envelope:
  success_and_5xx:
    content_type: application/json
    fields: [statusCode, statusMessage, uri, uriAlias, body]
    error_body_fields: [type, msg]
    example: '{"body":{"type":"internal_server_error","msg":"Internal Server Error"},"uriAlias":"/league/rules","uri":"/league/rules","statusCode":500,"statusMessage":null}'
  client_errors:
    content_type: text/plain
    fields: []
    note: bare English sentence, no structure
