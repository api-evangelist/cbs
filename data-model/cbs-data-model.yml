observations:
- >-
  There is no id prefix scheme. Player ids are bare numeric strings, so an id carries no
  type information and an agent cannot tell a player id from a league id by inspection.
- >-
  elias_id is the only external identifier in the model. Everything else is CBS-local.
- >-
  /players/list returns all 4,905 football entries in a single unpaginated response,
  including synthetic team-defence (DST) and team-quarterback (TQB) rows with empty
  firstname and the club name in lastname.
