description: >-
  CBS is the flagship broadcast television network of Paramount (Paramount Skydance
  Corporation, formerly Paramount Global), covering CBS Entertainment, CBS News, CBS
  Sports and the CBS owned-and-operated stations, and feeding Paramount+. CBS publishes
  no developer portal and no OpenAPI, AsyncAPI or GraphQL contract. Two first-party
  machine-readable surfaces are nonetheless live and anonymously reachable and are
  catalogued here: the legacy CBS Sports Fantasy REST API at api.cbssports.com/fantasy
  (v3.0, opened to third-party developers in 2012 and still returning HTTP 200 in
  September 2026, though its portal at developer.cbssports.com is now NXDOMAIN and its
  host serves Disallow to every robot), and the CBS News RSS feeds at
  cbsnews.com/latest/rss. Partner, syndication, advertising (EyeQ / Conduit) and
  distribution APIs stay private with no public contract.
apis:
- aid: cbs:cbs-sports-fantasy-api
  name: CBS Sports Fantasy API
  description: >-
    The CBS Sports Fantasy Platform REST API, version 3.0. Opened to third-party
    developers in January 2012 so apps could read league, team, player, draft,
    transaction and scoring data out of CBS Sports fantasy games. The developer
    program has been retired — developer.cbssports.com no longer resolves and no
    machine-readable contract is published anywhere — but the API host is still live:
    GET /fantasy/sports returns HTTP 200 with a JSON or XML envelope anonymously.
    League-scoped resources require an access token issued to a member of at least one
    league. Responses carry a statusCode / statusMessage / uri / uriAlias envelope;
    the version and response_format query parameters select the contract version
    (3.0) and JSON vs XML. api.cbssports.com/robots.txt serves `Disallow: /` to all
    user agents.
  humanURL: https://www.cbssports.com/fantasy/
  baseURL: https://api.cbssports.com/fantasy
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cbs.png
  tags:
  - Fantasy Sports
  - Sports
  - CBS Sports
  - Leagues
  - Players
  - Statistics
