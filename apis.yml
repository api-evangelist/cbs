- aid: cbs:cbs-news-rss-feeds
  name: CBS News RSS Feeds
  description: >-
    CBS News publishes a family of public RSS 2.0 feeds covering top stories and each
    editorial section (US, world, politics, technology, entertainment, health,
    moneywatch, science, space and the network's video and podcast output). The feed
    index at cbsnews.com/rss/ lists them. Each feed is a plain, unauthenticated
    HTTP GET returning RSS 2.0 XML with content, dc, media and CBS-namespaced
    extensions. It is the only documented, indexed, machine-readable content surface
    CBS News offers; there is no JSON content API, no OpenAPI and no key.
  humanURL: https://www.cbsnews.com/rss/
  baseURL: https://www.cbsnews.com/latest/rss
